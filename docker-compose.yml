version: '3.8'

services:
  shengji-workshop:
    build: .
    image: shengji-workshop:latest
    container_name: shengji-local-transcriber
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
